# Copyright (c) 2026 Torviello.
# HTTP status response policy for the engine contract. Sources:
#   RFC 9110 (HTTP Semantics), RFC 9457 (Problem Details), IANA registry.
# `engine` values:
#   used        - emitted by at least one operation declared in openapi.yaml.
#   conditional - protocol- or framework-generated only; not required in openapi.yaml.
#   not-used    - standard status, prohibited on the engine surface.
# Every assigned entry carries its trigger, content type, schema, header rules,
# cache/retry semantics, body fields, and stable error codes.
version: 2.0.0
classes:
  1: informational
  2: successful
  3: redirection
  4: client_error
  5: server_error
envelope:
  media_type: application/json
  schema: Envelope
  required_fields:
  - data
  - meta
  cache_control: per-operation
problem:
  media_type: application/problem+json
  schema: ErrorEnvelope
  required_fields:
  - type
  - title
  - status
  - code
  - category
  - detail
  - instance
  - request_id
  - retryable
  forbidden_fields:
  - data
  cache_control: no-store
assigned:
- code: 100
  name: Continue
  class: informational
  reference: RFC 9110 §15.2.1
  engine: not-used
  body: none
  trigger: Prohibited on the engine surface; no handler or framework fallback may emit this status.
  content_type: null
  schema: null
  required_headers: []
  optional_headers: []
  cache_control: null
  retry: never
  body_fields: []
  forbidden_body_fields: []
  error_codes: []
  error_category: null
  retryable: false
