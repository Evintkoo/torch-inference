headers:
  Allow:
    grammar: 1#method
    value: Comma-separated methods registered for the request target.
    notes: Every method declared for the path MUST appear; HEAD is implied by GET.
  Connection:
    grammar: token
    value: Upgrade
    notes: Required with 101 and an Upgrade header.
  Location:
    grammar: URI-reference
    value: Root-relative or absolute URI of the created resource.
    notes: Required on 201. Must not contain credentials.
  Retry-After:
    grammar: delta-seconds
    value: Non-negative integer seconds until the caller may retry.
    notes: HTTP-date form is not used. Required on 429 and retryable 503.
  Upgrade:
    grammar: 1#protocol
    value: websocket for 101; the required protocol token for 426.
    notes: Must name a protocol the server is willing to switch to.
  WWW-Authenticate:
    grammar: challenge
    value: Bearer realm="torviello"
    notes: Add error="invalid_token" for malformed or expired credentials; never echo the token.
