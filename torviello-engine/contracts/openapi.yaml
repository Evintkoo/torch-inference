openapi: 3.2.1
info:
  title: Torviello Engine API
  version: 1.0.0
  summary: Local inference contract for the Torviello engine.
  description: |
    Contract for the local engine surface: catalog, model acquisition, text-to-speech,
    speech-to-text, image classification, object detection, assistant proxy, health,
    metrics, diagnostics, and administrative model registration.

    Every successful capability response uses the result envelope. Every failure uses
    an RFC 9457 application/problem+json document with stable engine extensions.
    Authentication is enabled by default; protected routes require a bearer token.
    TLS 1.3 and asymmetric JWT algorithms under RFC 8725 are required for remote
    deployments. Test harnesses may construct an in-memory state with authentication
    disabled, but the shipped configuration cannot disable it.
  contact:
    name: Torviello engine owner
servers:
  - url: http://127.0.0.1:8000
    description: Default local bind. Loopback is the safe default.
tags:
  - name: Health
  - name: Catalog
  - name: Models
  - name: Speech
  - name: Vision
  - name: Assistant
  - name: Observability
  - name: Administration
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Report subsystem health.
      description: Returns liveness plus per-subsystem status. Optional subsystems report degraded without failing liveness. Readiness is reported separately.
      security: []
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Health snapshot. Process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthSnapshot" }
  /health/live:
    get:
      tags: [Health]
      operationId: getLiveness
      summary: Report process liveness.
      security: []
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: The process can make progress.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }
        "503":
          description: The process cannot make progress.
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Report readiness to serve inference.
      description: Ready only when required configuration, backends, and models are available. Saturation and rate limiting do not change readiness.
      security: []
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Ready.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
        "503":
          description: Not ready, with the pending or failed component.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
  /system:
    get:
      tags: [Observability]
      operationId: getSystemInfo
      summary: Report effective runtime information.
      description: Reports version, selected backend, devices, loaded models, uptime, and limits. Secrets and absolute host paths are redacted.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: System snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /system/logs:
    get:
      tags: [Observability]
      operationId: getSystemLogs
      summary: Read a bounded diagnostic log view.
      parameters:
        - name: lines
          in: query
          schema: { type: integer, minimum: 1, maximum: 5000, default: 200 }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Redacted diagnostic entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogView" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [Administration]
      operationId: clearSystemLogs
      summary: Clear the diagnostic log through an authorized, audited action.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "204": { description: Log cleared. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /models:
    get:
      tags: [Catalog]
      operationId: listModels
      summary: List model catalog entries with independent state dimensions.
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Catalog page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/ModelSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /models/{modelId}:
    get:
      tags: [Catalog]
      operationId: getModel
      summary: Read one model descriptor and its state.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Model detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /models/{modelId}/load:
    post:
      tags: [Models]
      operationId: loadModel
      summary: Load a model into a runtime slot.
      description: Idempotent for one model ID. Concurrent loads join the same initialization. The response reports the resulting slot state.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "202":
          description: Load admitted or already in progress.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelSlot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /models/{modelId}/unload:
    post:
      tags: [Models]
      operationId: unloadModel
      summary: Request unload of a model slot.
      description: Stops new references, drains active references, then frees resources.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "202":
          description: Unload admitted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelSlot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /models/{modelId}/download:
    post:
      tags: [Models]
      operationId: downloadModel
      summary: Acquire a model asset set.
      description: Creates a bounded download job. The model name is validated against traversal and the destination is confined to the model root. Integrity verifies before activation.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadRequest" }
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "202":
          description: Download job accepted.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DownloadJob" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /models/{modelId}/status:
    get:
      tags: [Models]
      operationId: getDownloadStatus
      summary: Read download progress and asset availability.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Download status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DownloadJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /models/{modelId}/download/progress:
    get:
      tags: [Models]
      operationId: streamDownloadProgress
      summary: Stream download progress as server-sent events.
      description: Emits bounded progress events and one terminal event. The stream closes after a terminal state.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/DownloadProgressEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /tts:
    post:
      tags: [Speech]
      operationId: synthesizeSpeech
      summary: Synthesize speech and return audio.
      description: Default output is 24 kHz mono 16-bit little-endian PCM unless a supported format is requested. Text, speed, and pitch are validated before synthesis.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TtsRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Audio bytes with synthesis metadata in headers.
          headers:
            X-Model-Id:
              schema: { type: string }
            X-Sample-Rate:
              schema: { type: integer }
            X-Request-Id:
              schema: { type: string }
          content:
            audio/L16:
              schema: { type: string, format: binary }
            audio/wav:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /tts/stream:
    post:
      tags: [Speech]
      operationId: streamSpeech
      summary: Stream synthesized speech.
      description: Returns ordered binary chunks with a declared framing. The producer observes disconnect and releases worker resources.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TtsRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Ordered audio stream.
          content:
            audio/L16:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /stt:
    post:
      tags: [Speech]
      operationId: transcribeSpeech
      summary: Transcribe an audio payload.
      description: Audio is bounded before decode. Response carries transcript, detected language, duration, and timing.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SttRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Transcript result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Transcript" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /classify:
    post:
      tags: [Vision]
      operationId: classifyImages
      summary: Classify one or more images.
      description: Preserves input order. Each request is bounded by image count and dimension; top_k is validated before inference.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/ClassifyRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Classification results in input order.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Classification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /detect:
    post:
      tags: [Vision]
      operationId: detectObjects
      summary: Detect objects in an image.
      description: Validates model family and size, applies confidence and IoU thresholds, and returns stable class and box fields.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/DetectRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Detection result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/DetectionResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /v1/chat/completions:
    post:
      tags: [Assistant]
      operationId: createChatCompletion
      summary: Proxy an assistant completion to the configured upstream.
      description: Optional capability. Preserves request identifiers, applies deadlines and bounded retries when streaming, isolates upstream credentials, and does not gate local readiness.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatRequest" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Completion or streamed completion.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatResponse" }
            text/event-stream:
              schema: { $ref: "#/components/schemas/ChatStreamEvent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/BadGateway" }
        "503": { $ref: "#/components/responses/Unavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }
  /metrics:
    get:
      tags: [Observability]
      operationId: getMetrics
      summary: Expose Prometheus text metrics.
      description: Label sets are bounded. Request content, identifiers, paths, and user-controlled values never appear as labels.
      security: []
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200":
          description: Prometheus exposition.
          content:
            text/plain:
              schema: { type: string }
        "503":
          description: Metrics subsystem unavailable.
          content:
            text/plain:
              schema: { type: string }
  /api/v1/models:
    get:
      tags: [Catalog]
      operationId: listModelsAlias
      summary: Versioned alias of GET /models.
      x-alias-of: /models
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1models/get/responses/200" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Administration]
      operationId: registerModel
      summary: Register a model descriptor.
      description: Authorized, audited, and atomic. Re-registering an identical descriptor is idempotent; a conflicting descriptor returns 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModelRegistration" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "201":
          description: Model registered.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/ModelDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/models/{modelId}:
    delete:
      tags: [Administration]
      operationId: deleteModel
      summary: Remove a model descriptor and managed assets.
      description: Refuses while the model is loaded or has active references. The action is authorized and audited.
      parameters:
        - $ref: "#/components/parameters/ModelId"
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /ws/audio:
    get:
      tags: [Speech]
      operationId: audioWebSocket
      summary: Realtime audio session.
      description: WebSocket upgrade. Negotiates audio framing, applies bounded buffers and ordered frames, and releases work on disconnect.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "101": { description: Switching protocols. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /ws/classify:
    get:
      tags: [Vision]
      operationId: classifyWebSocket
      summary: Realtime classification session.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "101": { description: Switching protocols. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /ws/detect:
    get:
      tags: [Vision]
      operationId: detectWebSocket
      summary: Realtime detection session.
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "101": { description: Switching protocols. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealthAlias
      summary: Versioned alias of /health.
      x-alias-of: /health
      security: []
      responses:
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1health/get/responses/200" }
  /api/v1/tts:
    post:
      tags: [Speech]
      operationId: synthesizeSpeechAlias
      summary: Versioned alias of /tts.
      x-alias-of: /tts
      requestBody: { $ref: "#/paths/~1tts/post/requestBody" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1tts/post/responses/200" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/tts/stream:
    post:
      tags: [Speech]
      operationId: streamSpeechAlias
      summary: Versioned alias of /tts/stream.
      x-alias-of: /tts/stream
      requestBody: { $ref: "#/paths/~1tts~1stream/post/requestBody" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1tts~1stream/post/responses/200" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/stt:
    post:
      tags: [Speech]
      operationId: transcribeSpeechAlias
      summary: Versioned alias of /stt.
      x-alias-of: /stt
      requestBody: { $ref: "#/paths/~1stt/post/requestBody" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1stt/post/responses/200" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/classify:
    post:
      tags: [Vision]
      operationId: classifyImagesAlias
      summary: Versioned alias of /classify.
      x-alias-of: /classify
      requestBody: { $ref: "#/paths/~1classify/post/requestBody" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1classify/post/responses/200" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
  /api/v1/detect:
    post:
      tags: [Vision]
      operationId: detectObjectsAlias
      summary: Versioned alias of /detect.
      x-alias-of: /detect
      requestBody: { $ref: "#/paths/~1detect/post/requestBody" }
      responses:
        "501": { $ref: "#/components/responses/NotImplemented" }
        "500": { $ref: "#/components/responses/InternalError" }
        "200": { $ref: "#/paths/~1detect/post/responses/200" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/TooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "503": { $ref: "#/components/responses/Unavailable" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256, HS384, or HS512. Disabled by default in local mode.
  parameters:
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
  responses:
    BadRequest:
      description: Invalid input or parameter.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: Missing or invalid credential.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Forbidden:
      description: Valid credential lacks the required scope.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: Model or resource does not exist.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Conflict:
      description: Request conflicts with current state.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    TooLarge:
      description: Payload, item count, or dimension exceeds a limit.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMediaType:
      description: Payload encoding is not supported.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    InternalError:
      description: Unhandled internal failure.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotImplemented:
      description: The route is reserved by the contract but the operation is not implemented.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    RateLimited:
      description: Caller exceeded its budget.
      headers:
        Retry-After:
          schema: { type: integer, minimum: 0 }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unavailable:
      description: Required component or model is unavailable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    GatewayTimeout:
      description: Upstream or execution deadline expired.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadGateway:
      description: Upstream returned an invalid or failed response.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    Envelope:
      type: object
      required: [data, meta]
      properties:
        data: {}
        meta: { $ref: "#/components/schemas/Meta" }
    Meta:
      type: object
      required: [latency_ms, model_id, postprocessing_applied, version, request_id]
      properties:
        latency_ms: { type: integer, minimum: 0 }
        model_id: { type: string }
        backend: { type: string }
        postprocessing_applied: { type: boolean }
        postprocess_steps:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        version: { type: string }
        request_id: { type: string }
    ErrorEnvelope:
      type: object
      description: |
        RFC 9457 problem details with stable engine extensions. The response
        content type is application/problem+json. The `type` URI identifies the
        error class; `code` is the stable machine-readable engine identifier.
      required: [type, title, status, code, category, detail, instance, request_id, retryable]
      properties:
        type: { type: string, format: uri, description: Stable URI identifying the error class. }
        title: { type: string, description: Short human-readable summary. }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, description: Safe explanation that does not leak internals. }
        instance: { type: string, format: uri-reference, description: Request-specific occurrence identifier. }
        code: { type: string, examples: [MODEL_NOT_FOUND], description: Stable engine error code. }
        category:
          type: string
          enum: [validation, authentication, authorization, not_found, conflict, limit, unavailable, upstream, internal]
        retryable: { type: boolean }
        retry_after_ms: { type: integer, minimum: 0 }
        errors:
          type: array
          description: Field-level validation failures.
          items:
            type: object
            required: [field, code]
            properties:
              field: { type: string }
              code: { type: string }
              detail: { type: string }
        request_id: { type: string }
        timestamp: { type: string, format: date-time }
    ModelSummary:
      type: object
      required: [model_id, task, format, catalog_present, locally_available, download_state, load_state]
      properties:
        model_id: { type: string }
        display_name: { type: string }
        task: { type: string, enum: [tts, stt, classification, detection, chat, tensor] }
        format: { type: string }
        catalog_present: { type: boolean }
        locally_available: { type: boolean }
        download_state: { type: string, enum: [absent, queued, downloading, verifying, ready, failed, cancelled] }
        load_state: { type: string, enum: [unloaded, queued, loading, ready, draining, failed] }
        size_bytes: { type: integer, minimum: 0 }
    ModelDetail:
      allOf:
        - $ref: "#/components/schemas/ModelSummary"
        - type: object
          properties:
            description: { type: string }
            version: { type: string }
            backend_requirements:
              type: array
              items: { type: string }
            input_contract: { type: object }
            asset_digest: { type: string }
            provenance:
              type: object
              properties:
                source_scheme: { type: string }
                license: { type: string }
    ModelSlot:
      type: object
      required: [model_id, state]
      properties:
        model_id: { type: string }
        state: { type: string, enum: [unloaded, queued, loading, ready, draining, failed] }
        backend: { type: string }
        device: { type: string }
        precision: { type: string }
        references: { type: integer, minimum: 0 }
        loaded_at: { type: string, format: date-time }
        error_code: { type: string }
    DownloadRequest:
      type: object
      required: [source]
      properties:
        source:
          type: object
          required: [scheme]
          properties:
            scheme: { type: string, enum: [huggingface, https, local] }
            repository: { type: string }
            revision: { type: string }
            url: { type: string, format: uri }
            path: { type: string, description: Path relative to the configured model root. }
        expected_digest:
          type: object
          properties:
            algorithm: { type: string, enum: [sha256] }
            value: { type: string, pattern: "^[a-f0-9]{64}$" }
    DownloadJob:
      type: object
      required: [task_id, model_id, state]
      properties:
        task_id: { type: string }
        model_id: { type: string }
        state: { type: string, enum: [queued, downloading, verifying, extracting, ready, failed, cancelled] }
        bytes_transferred: { type: integer, minimum: 0 }
        bytes_total: { type: integer, minimum: 0 }
        percent: { type: number, minimum: 0, maximum: 100 }
        error_code: { type: string }
        safe_message: { type: string }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DownloadProgressEvent:
      type: object
      required: [event_type, task_id, model_id, state]
      properties:
        event_type: { type: string, enum: [model.download_progress, model.download_verified, model.download_failed, model.activated] }
        event_id: { type: string }
        occurred_at: { type: string, format: date-time }
        task_id: { type: string }
        model_id: { type: string }
        state: { type: string }
        bytes_transferred: { type: integer }
        bytes_total: { type: integer }
        error_code: { type: string }
    TtsRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 5000 }
        model_id: { type: string }
        voice: { type: string }
        language: { type: string }
        speed: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
        pitch: { type: number, minimum: 0.5, maximum: 2.0, default: 1.0 }
        format: { type: string, enum: [pcm_s16le, wav], default: pcm_s16le }
        sample_rate: { type: integer, enum: [24000], default: 24000 }
    SttRequest:
      type: object
      required: [file, model_id]
      properties:
        file:
          type: string
          format: binary
          description: Bounded audio payload.
        model_id: { type: string }
        language: { type: string, description: Optional hint; response reports the effective language. }
        response_format: { type: string, enum: [json, text], default: json }
    Transcript:
      type: object
      required: [text, language, duration_ms]
      properties:
        text: { type: string }
        language: { type: string }
        duration_ms: { type: integer, minimum: 0 }
        segments:
          type: array
          items:
            type: object
            properties:
              start_ms: { type: integer }
              end_ms: { type: integer }
              text: { type: string }
    ClassifyRequest:
      type: object
      required: [images, model_id]
      properties:
        images:
          type: array
          minItems: 1
          maxItems: 128
          items: { type: string, format: binary }
        model_id: { type: string }
        top_k: { type: integer, minimum: 1, maximum: 1000, default: 5 }
    Classification:
      type: object
      required: [index, predictions]
      properties:
        index: { type: integer, minimum: 0 }
        predictions:
          type: array
          items:
            type: object
            required: [label, score]
            properties:
              label: { type: string }
              score: { type: number, minimum: 0, maximum: 1 }
    DetectRequest:
      type: object
      required: [image, model_id]
      properties:
        image: { type: string, format: binary }
        model_id: { type: string }
        confidence_threshold: { type: number, minimum: 0, maximum: 1, default: 0.25 }
        iou_threshold: { type: number, minimum: 0, maximum: 1, default: 0.45 }
        max_detections: { type: integer, minimum: 1, maximum: 1000, default: 300 }
    DetectionResult:
      type: object
      required: [detections]
      properties:
        detection_count: { type: integer, minimum: 0 }
        detections:
          type: array
          items:
            type: object
            required: [class_id, label, confidence, box]
            properties:
              class_id: { type: integer, minimum: 0 }
              label: { type: string }
              confidence: { type: number, minimum: 0, maximum: 1 }
              box:
                type: object
                required: [x, y, width, height]
                properties:
                  x: { type: number }
                  y: { type: number }
                  width: { type: number }
                  height: { type: number }
    ChatRequest:
      type: object
      required: [messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role: { type: string, enum: [system, user, assistant] }
              content: { type: string, maxLength: 100000 }
        stream: { type: boolean, default: false }
        temperature: { type: number, minimum: 0, maximum: 2 }
        max_tokens: { type: integer, minimum: 1, maximum: 32768 }
    ChatResponse:
      type: object
      required: [id, choices]
      properties:
        id: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                type: object
                properties:
                  role: { type: string }
                  content: { type: string }
              finish_reason: { type: string }
    ChatStreamEvent:
      type: object
      properties:
        id: { type: string }
        delta: { type: string }
        finish_reason: { type: string, nullable: true }
    HealthSnapshot:
      type: object
      required: [status, subsystems, uptime_ms, version]
      properties:
        status: { type: string, enum: [ok, degraded, unavailable] }
        uptime_ms: { type: integer, minimum: 0 }
        version: { type: string }
        subsystems:
          type: array
          items:
            type: object
            required: [name, status, required]
            properties:
              name: { type: string }
              status: { type: string, enum: [ok, degraded, unavailable] }
              required: { type: boolean }
              error_code: { type: string }
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [alive] }
    Readiness:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }
        pending:
          type: array
          items: { type: string }
        failed:
          type: array
          items: { type: string }
        backend: { type: string }
        loaded_models: { type: integer, minimum: 0 }
    SystemInfo:
      type: object
      required: [version, backend, device, models, limits]
      properties:
        version: { type: string }
        build_profile: { type: string }
        backend: { type: string }
        device: { type: string }
        precision: { type: string }
        uptime_ms: { type: integer, minimum: 0 }
        models:
          type: array
          items: { $ref: "#/components/schemas/ModelSummary" }
        limits:
          type: object
          additionalProperties: { type: integer }
        sampling_window_seconds: { type: integer, minimum: 1 }
    LogView:
      type: object
      required: [entries, truncated]
      properties:
        entries:
          type: array
          items:
            type: object
            properties:
              timestamp: { type: string, format: date-time }
              level: { type: string, enum: [error, warn, info, debug, trace] }
              target: { type: string }
              request_id: { type: string }
              message: { type: string }
        truncated: { type: boolean }
        next_cursor: { type: string }
    ModelRegistration:
      type: object
      required: [model_id, task, format, asset_digest]
      properties:
        model_id:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
        display_name: { type: string }
        task: { type: string, enum: [tts, stt, classification, detection, chat, tensor] }
        format: { type: string }
        version: { type: string }
        asset_digest:
          type: object
          required: [algorithm, value]
          properties:
            algorithm: { type: string, enum: [sha256] }
            value: { type: string, pattern: "^[a-f0-9]{64}$" }
        backend_requirements:
          type: array
          items: { type: string }
        provenance:
          type: object
          properties:
            source_scheme: { type: string }
            license: { type: string }
x-engine:
  default_bind: 127.0.0.1:8000
  authentication_default: enabled
  local_token_algorithms: [HS256, HS384, HS512]
  remote_token_algorithms: [ES256, EdDSA, RS256]
  token_ttl_minutes: 60
  tls_minimum: "1.3"
  error_media_type: application/problem+json
  problem_details_rfc: RFC 9457
  jwt_bcp_rfc: RFC 8725
  assurance_level: HPA-4
  assurance_standard: requirements/assurance-standard.md
  contract_baseline: 3.2.1
  standards_baseline_reviewed: "2026-10-20"
  middleware_order:
    - correlation_id
    - request_logger
    - auth
    - rate_limit
    - security_headers
    - compress
  tts_defaults:
    sample_rate: 24000
    channels: 1
    encoding: pcm_s16le
  classification_limits:
    max_images: 128
    max_top_k: 1000
    max_dimension: 4096
  requirement_set: requirements/engine-runtime.md
  aliases:
    /api/v1/health: /health
    /api/v1/models: /models
    /api/v1/tts: /tts
    /api/v1/tts/stream: /tts/stream
    /api/v1/stt: /stt
    /api/v1/classify: /classify
    /api/v1/detect: /detect
  alias_rule: Versioned aliases resolve to the same handler and preserve status, headers, and body shape.
