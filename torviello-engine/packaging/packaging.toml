# Copyright (c) 2026 Torviello.
# Declarative release definition consumed by packaging/torviello_package.py.
schema = 1

[product]
name = "torviello-engine"
version_source = "Cargo.toml"
version_table = "workspace.package"
output_dir = "dist"

[profiles.engine]
description = "Engine-only inference backend without persistence, telemetry, or accelerators."
features = ["engine"]
binary = "torviello-engine"
include = [
  "LICENSE",
  "NOTICE",
  "COMMERCIAL_LICENSE.md",
  "SECURITY.md",
  "torviello-engine/config/default.toml",
  "torviello-engine/config/model-registry.toml",
  "torviello-engine/containers/compose.yaml",
  "torviello-docs/docs/DEPLOYMENT.md",
  "torviello-docs/docs/INSTALL.md",
  "torviello-docs/docs/PRIVACY.md",
  "torviello-docs/docs/SUPPORTED_PLATFORMS.md",
  "torviello-engine/packaging/systemd/torviello-engine.service",
  "torviello-engine/services/engine/api/contracts/schema.json",
  "torviello-engine/services/engine/assets/scalar.LICENSE.txt",
  "torviello-engine/contracts/openapi.yaml",
]

[profiles.full]
description = "Full package with SQLite persistence, telemetry, and TorchScript execution."
features = ["full"]
binary = "torviello-engine"
# Required by GOV-12-validated packaging: the libtorch cache layout that lets
# `build --offline` reproduce the full profile without network access.
cache = [
  "cargo registry and git caches warmed by `packaging prepare --profile full` (cargo fetch --locked plus one networked release build)",
  "target/<target>/release holding the warmed full-profile build plan for the declared target triple",
  "torch-sys libtorch cache (downloaded bundle, or LIBTORCH / LIBTORCH_BUNDLE_PATH when pinned) so offline builds never fetch libtorch",
]
include = [
  "LICENSE",
  "NOTICE",
  "COMMERCIAL_LICENSE.md",
  "SECURITY.md",
  "torviello-engine/config/default.toml",
  "torviello-engine/config/model-registry.toml",
  "torviello-engine/containers/compose.yaml",
  "torviello-docs/docs/DEPLOYMENT.md",
  "torviello-docs/docs/INSTALL.md",
  "torviello-docs/docs/PRIVACY.md",
  "torviello-docs/docs/SUPPORTED_PLATFORMS.md",
  "torviello-engine/packaging/systemd/torviello-engine.service",
  "torviello-engine/services/engine/api/contracts/schema.json",
  "torviello-engine/services/engine/assets/scalar.LICENSE.txt",
  "torviello-engine/contracts/openapi.yaml",
]
