<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Torviello — the execution layer for AI. An AI-native inference engine built to infer." />
    <meta name="theme-color" content="#0b1020" />
    <title>Torviello — The execution layer for AI</title>

    <!-- SEO-01..03: primary meta (SEO readiness, ticket 0045). The base URL
         is the declared canonical; it lives in web/.env (VITE_SITE_URL) and
         is replaced here and in robots/sitemap by the build (ticket 0047).
         Flip web/.env to https://torviello.dev/ once the domain is registered
         and wired as the Pages custom domain. -->
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <meta name="robots" content="index, follow" />

    <!-- SEO-04: Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Torviello" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Torviello — The execution layer for AI" />
    <meta property="og:description" content="An AI-native inference engine built to infer. From experimentation to production: speed, control, and flexibility to run AI your way." />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="776" />
    <meta property="og:image:height" content="346" />
    <meta property="og:image:alt" content="Builders working with the Torviello engine" />

    <!-- SEO-05: Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Torviello — The execution layer for AI" />
    <meta name="twitter:description" content="An AI-native inference engine built to infer. From experimentation to production: speed, control, and flexibility to run AI your way." />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og-image.jpg" />

    <!-- SEO-06: structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%VITE_SITE_URL%/#organization",
            "name": "Torviello",
            "url": "%VITE_SITE_URL%/",
            "logo": {
              "@type": "ImageObject",
              "url": "%VITE_SITE_URL%/favicon.svg"
            }
          },
          {
            "@type": "WebSite",
            "@id": "%VITE_SITE_URL%/#website",
            "url": "%VITE_SITE_URL%/",
            "name": "Torviello",
            "description": "The execution layer for AI. An AI-native inference engine built to infer.",
            "publisher": { "@id": "%VITE_SITE_URL%/#organization" }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
