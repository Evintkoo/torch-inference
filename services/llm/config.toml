port = 8001

[hrm]
model_dir      = "models/hrm-text-1b"
ep_preference  = "auto"
use_quantized  = false
n_threads      = 4

[vision_bridge]
enabled              = true
main_server_base     = "http://127.0.0.1:8000"
classify_endpoint    = "/classify/batch"
detect_endpoint      = "/yolo/detect"
classify_timeout_ms  = 1500
detect_timeout_ms    = 2500

[agent]
enabled                = true
max_steps              = 8
max_run_ms             = 60000
per_tool_ms            = 5000
max_concurrent_runs    = 4
reflect_max_tokens     = 128
planner_temperature    = 0.0

[agent.http_fetch]
enabled                = true
allowlist              = []
max_bytes              = 65536
follow_redirects       = false

[agent.tools]
main_server_base       = "http://127.0.0.1:8000"
classify_endpoint      = "/classify/batch"
detect_endpoint        = "/yolo/detect"
tts_endpoint           = "/tts/stream"
stt_endpoint           = "/stt/transcribe"

[limits]
max_image_bytes        = 2097152
max_prompt_chars       = 16384
max_messages           = 32
max_generated_tokens   = 512
max_ctx_size           = 1024

[limits.json]
body_limit             = 4194304

[limits.channels]
sse_event_buffer       = 8
chat_stream_buffer     = 16
chat_nonstream_buffer  = 64

[limits.engine]
max_concurrent         = 1

[limits.results]
per_run_bytes          = 65536
field_trim_above       = 8192

[memory_gate]
# HRM-Text-1B's real steady-state RSS sits around ~6.3GB once the model is
# loaded and has run at least one inference (weights + ONNX Runtime scratch/
# activation buffers for the multi-loop slow/fast HRM architecture) -- these
# thresholds were previously 4096/3072, well below that floor, so the gate
# tripped on the very first request and then refused every request after
# forever (RSS can never drop back below a low-water mark that's under the
# model's own baseline footprint). Raised with headroom above the observed
# ~6.3GB floor, scaled for a 24GB host; on a smaller host lower both figures
# but keep them above the model's actual settled RSS.
high_water_mb          = 12288
low_water_mb           = 10240
poll_on_admit_only     = true

[kv_cache]
enabled                = false
