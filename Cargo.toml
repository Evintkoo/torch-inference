[package]
name = "torch_inference"
version = "1.0.0"
edition = "2021"
description = "High-performance PyTorch inference framework in Rust"
license = "Apache-2.0"
authors = ["Genta Dev Team"]
default-run = "torch-inference-server"

[package.metadata.deb]
maintainer = "Evint Leovonzko <evint.koo@gmail.com>"
copyright = "2026, Evint Leovonzko"
license-file = ["LICENSE", "4"]
extended-description = """\
High-performance multimodal inference server (TTS, STT, image \
classification, object detection, LLM chat) built in Rust."""
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/torch-inference-server", "usr/bin/", "755"],
    ["config.toml", "usr/share/torch-inference-server/config.toml", "644"],
    ["scripts/download_models.sh", "usr/share/torch-inference-server/download_models.sh", "755"],
    ["packaging/README-first-run.txt", "usr/share/doc/torch-inference-server/README-first-run.txt", "644"],
]

[dependencies]
# Web framework
actix-web = "4.8"
actix-ws = "0.3"
actix-rt = "2.10"
actix-files = "0.6"
actix-multipart = "0.7"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }

# Serialization
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
simd-json = { version = "0.13", features = ["serde_impl"] }
toml = "0.8"
serde_yaml = "0.9"

# HTTP and async
reqwest = { version = "0.12", features = ["json", "stream"] }
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"

# Image processing — image 0.25 + matching imageproc 0.25 and
# fast_image_resize 5.x. Closes the decoder-DoS CVE class flagged by
# cargo-audit. API churn handled in image_security.rs / image_pipeline.rs
# / image.rs.
image = "0.25"
imageproc = "0.25"
fast_image_resize = "5"

# Audio processing
hound = "3.5"
rustfft = "6"
rodio = "0.17"
rubato = "0.14"
symphonia = { version = "0.5", features = ["wav", "mp3", "flac", "pcm", "vorbis"] }

# ML and inference
onnxruntime = { version = "0.0.14", optional = true }
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["load-dynamic", "half", "copy-dylibs", "coreml", "cuda", "directml", "ndarray"] }
ndarray = "0.15"
tch = { version = "0.16", optional = true, features = [] }  # Requires PyTorch 2.3.0+
pyo3 = { version = "0.24", features = ["auto-initialize"], optional = true }

# Logging and monitoring
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt", "ansi"] }
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.22", optional = true }
opentelemetry = { version = "0.21", optional = true }
opentelemetry-otlp = { version = "0.14", optional = true }
opentelemetry_sdk = { version = "0.21", features = ["rt-tokio"], optional = true }
sys-info = "0.9"
prometheus = { version = "0.13", optional = true }
lazy_static = "1.4"

# Security and auth
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }
bcrypt = "0.15"
uuid = { version = "1.10", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Caching
dashmap = "5.5"
lru = "0.16"
parking_lot = "0.12"
ahash = "0.8"

# Compression
flate2 = "1.0"
tar = "0.4"
zip = "2.2"

# System info
num_cpus = "1.16"
sysinfo = "0.31"
# POSIX _exit to bypass onnxruntime's macOS static-destructor SIGABRT at exit.
libc = "0.2"
nvml-wrapper = { version = "0.9", optional = true }
pprof = { version = "0.14", features = ["flamegraph"], optional = true }

# Progress tracking
indicatif = "0.17"

# Validation
validator = { version = "0.16", features = ["derive"] }
regex = "1.10"

# File operations
walkdir = "2.4"
tempfile = "3.8"
bytes = "1.5"

# Frontend embedding — the built web/dist/ SPA bundle, embedded into the binary
rust-embed = "8"

# Performance — SIMD, zero-copy
wide = "0.7"                                                         # AVX2/NEON SIMD via safe API
zune-jpeg = "0.4"                                                    # 2× faster JPEG decode (SIMD)
bytemuck = { version = "1.14", features = ["derive"] }               # zero-copy type punning
crossbeam-queue = "0.3"                                              # lock-free queues
core_affinity = "0.8"                                                # CPU core pinning
rayon = "1.10"                                                       # data-parallel CPU ops (ndarray, image preprocessing)

# jemalloc does not build on MSVC — excluded from the dependency graph
# entirely on that target so `cargo build --features production` succeeds
# on Windows. src/main.rs already gates *use* of the allocator with the
# matching `not(target_env = "msvc")` cfg; this just keeps Cargo from ever
# trying to compile the crate there.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator = { version = "0.5", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
quickcheck = "1.0"
quickcheck_macros = "1.0"
tokio-test = "0.4"
mockall = "0.12"
rstest = "0.18"
test-case = "3.3"
serial_test = "3.0"
futures-util = "0.3"
wiremock = "0.6"
libloading = "0.8"

[features]
default = ["jemalloc"]  # Use jemalloc by default for better performance
production = ["jemalloc", "metrics", "telemetry", "simd-image"]
cuda = ["nvml-wrapper"]
onnx = ["onnxruntime"]
torch = ["tch"]
python = ["pyo3"]
telemetry = ["tracing-opentelemetry", "opentelemetry", "opentelemetry-otlp", "opentelemetry_sdk"]
metrics = ["prometheus"]
jemalloc = ["tikv-jemallocator"]
all-backends = ["cuda", "onnx", "torch"]
# High-performance features
simd-image = []                         # SIMD image preprocessing (zune-jpeg + wide)
profiling = ["dep:pprof"]               # Optional pprof flamegraph profiling (off by default)

[lib]
name = "torch_inference"
path = "src/lib.rs"

[[bin]]
name = "torch-inference-server"
path = "src/main.rs"

[[bin]]
name = "provider-comparison"
path = "src/bin/provider_comparison.rs"

[[bench]]
name = "throughput_bench"
harness = false

[[bench]]
name = "tts_bench"
harness = false

[[bench]]
name = "audio_bench"
harness = false

[[bench]]
name = "classification_bench"
harness = false

[[bench]]
name = "detection_bench"
harness = false

[[bench]]
name = "yolo_detector_cache_bench"
harness = false

[[bench]]
name = "cache_bench"
harness = false

[[bench]]
name = "gpu_stress"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Fast release profile for local iteration. ~3-4× faster compile than the
# fat-LTO `release` profile, with ~2-5% runtime regression. Use:
#   cargo build --profile release-fast
#   cargo run --profile release-fast --no-default-features
[profile.release-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

# Bench uses thin LTO so criterion iterations don't pay the 2-min fat-LTO cost.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev]
opt-level = 0
incremental = true
codegen-units = 256

[profile.test]
opt-level = 1
incremental = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }
