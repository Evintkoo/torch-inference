# Copyright (c) 2026 Torviello.
[workspace]
members = ["torviello-engine/services/engine"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
too_many_arguments = "warn"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
