[project]
name = "torviello-enforcer-checks"
version = "0.1.0"
description = "Structural checks for the Torviello rules corpus"
requires-python = ">=3.15"
dependencies = []

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "openapi-spec-validator>=0.9.0",
    "pytest>=9,<10",
    "pyyaml>=6.0.3",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["torviello-enforcer", "torviello-engine/services/engine-py", "torviello-bench/benchmarks/tests", "torviello-engine/packaging/tests", "torviello-roles"]
python_files = ["test_*.py"]
addopts = ["-ra"]
pythonpath = ["torviello-engine/services/engine-py", "torviello-bench/benchmarks", "torviello-roles"]

[tool.uv]
package = false
required-version = ">=0.13.1"
