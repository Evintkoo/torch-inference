name: Deploy landing

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy publishes a new release; rollback repoints the active release"
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      into:
        description: "rollback only: explicit target release id (default: newest non-active)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - "torviello-landing/**"
      - ".github/workflows/deploy-landing.yml"

# Two thin CI invokers in one file:
#  - landing-deploy: runs the unit's SSH deploy tooling against the Oracle VM
#    (dormant until the VM/SSH access exists; dispatch supports rollback).
#  - publish-pages: publishes the built site to GitHub Pages so every push to
#    main touching torviello-landing goes live at
#    https://evintkoo.github.io/torch-inference/ (the interim public link,
#    ticket 0047).
# All deployment logic, manifests, and server configuration live inside
# torviello-landing (GOV-12.04). The root placement of this workflow file is
# the recorded owner decision on ticket 0044.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  landing-deploy:
    name: landing-${{ github.event.inputs.mode || 'deploy' }}
    # VM deploys are deliberate actions (dispatch), never implicit on push:
    # the Oracle VM is dormant until the owner provisions it (ticket 0047).
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: landing-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deploy secrets
        env:
          HAS_HOST: ${{ secrets.LANDING_DEPLOY_HOST != '' }}
          HAS_KEY: ${{ secrets.LANDING_DEPLOY_SSH_KEY != '' }}
        run: |
          if [ "$HAS_HOST" != "true" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error::Deploy secrets missing. Add them under Settings -> Secrets and variables -> Actions:"
            echo "::error::  LANDING_DEPLOY_HOST    - SSH destination, e.g. ubuntu@<vm-ip> (see torviello-landing/deploy/server-setup.md)"
            echo "::error::  LANDING_DEPLOY_SSH_KEY - PEM private key of a dedicated CI deploy key enrolled on the VM"
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install web dependencies
        run: cd torviello-landing/web && bun install --frozen-lockfile

      - name: Write CI deploy key
        env:
          LANDING_DEPLOY_SSH_KEY: ${{ secrets.LANDING_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LANDING_DEPLOY_SSH_KEY" > ~/.ssh/landing_deploy_key
          chmod 600 ~/.ssh/landing_deploy_key

      - name: Deploy new release
        if: ${{ github.event.inputs.mode != 'rollback' }}
        env:
          LANDING_DEPLOY_HOST: ${{ secrets.LANDING_DEPLOY_HOST }}
          LANDING_DEPLOY_SSH_PORT: ${{ secrets.LANDING_DEPLOY_SSH_PORT || '22' }}
          LANDING_DEPLOY_SSH_OPTIONS: "-i $HOME/.ssh/landing_deploy_key -o StrictHostKeyChecking=accept-new"
        run: cd torviello-landing && bun deploy/deploy.ts deploy

      - name: Roll back to previous release
        if: ${{ github.event.inputs.mode == 'rollback' && github.event.inputs.into == '' }}
        env:
          LANDING_DEPLOY_HOST: ${{ secrets.LANDING_DEPLOY_HOST }}
          LANDING_DEPLOY_SSH_PORT: ${{ secrets.LANDING_DEPLOY_SSH_PORT || '22' }}
          LANDING_DEPLOY_SSH_OPTIONS: "-i $HOME/.ssh/landing_deploy_key -o StrictHostKeyChecking=accept-new"
        run: cd torviello-landing && bun deploy/deploy.ts rollback

      - name: Roll back to explicit release
        if: ${{ github.event.inputs.mode == 'rollback' && github.event.inputs.into != '' }}
        env:
          LANDING_DEPLOY_HOST: ${{ secrets.LANDING_DEPLOY_HOST }}
          LANDING_DEPLOY_SSH_PORT: ${{ secrets.LANDING_DEPLOY_SSH_PORT || '22' }}
          LANDING_DEPLOY_SSH_OPTIONS: "-i $HOME/.ssh/landing_deploy_key -o StrictHostKeyChecking=accept-new"
        run: cd torviello-landing && bun deploy/deploy.ts rollback --into "${{ github.event.inputs.into }}"

      - name: Remove CI deploy key
        if: always()
        run: rm -f ~/.ssh/landing_deploy_key

  publish-pages:
    name: publish-pages
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install web dependencies
        run: cd torviello-landing/web && bun install --frozen-lockfile

      - name: Build the landing site
        run: cd torviello-landing/web && bun run build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: torviello-landing/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
