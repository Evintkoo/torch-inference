name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Context name `rules-check` is the branch-protection required check on main
  # (restored — the protection predates a job rename; same validation).
  rules-check:
    name: rules-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run python torviello-engine/contracts/tools/contracts.py check
      - run: uv run python torviello-engine/contracts/tools/status_tester.py
      - run: uv run --locked pytest

  rust:
    name: rust-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked --no-default-features
      - run: cargo build --locked --features full

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 95 --summary-only

  performance:
    name: performance-cpu
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: cargo build --release --locked --no-default-features --features torchscript
      # tch/download-libtorch extracts the runtime into torch-sys's OUT_DIR but
      # links it without an embedded rpath, so the engine dies at exec on Linux
      # with "libtorch_cpu.so: cannot open shared object file" (ticket 0048,
      # CI runs 42844563097/42848594814 — the bench saw a bare liveness
      # timeout). Export the loader path for the bench step; fail fast here if
      # the layout ever moves.
      - name: Locate the downloaded libtorch runtime
        run: |
          libdir="$(find target/release/build -type d -path '*/out/libtorch/lib' -print -quit)"
          test -f "$libdir/libtorch_cpu.so"
          echo "LD_LIBRARY_PATH=$libdir" >> "$GITHUB_ENV"
      - run: >-
          uv run python torviello-bench/benchmarks/classify_bench.py
          --requests 1000
          --warmup 30
          --idle-seconds 3
          --budget torviello-bench/benchmarks/budgets/classify-cpu.json
          --output torviello-bench/evaluations/reports/ci/results.json

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run python torviello-engine/packaging/torviello_package.py validate
      - run: uv run pytest
      - run: uv run ruff check .

  windows-installer:
    name: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked
      - run: uv run python torviello-engine/packaging/torviello_package.py build --profile engine
      - run: |
          $manifest = (Get-ChildItem dist -Filter *.manifest.json | Select-Object -First 1).FullName
          $archive = (Get-ChildItem dist -Filter *.zip | Select-Object -First 1).FullName
          dotnet tool install --global wix --version 6.0.1
          uv run python torviello-engine/packaging/torviello_package.py installer `
            --manifest $manifest --archive $archive --out dist/installer --wix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: torviello-engine-windows-installer
          path: dist/installer/*.msi
          if-no-files-found: error

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: mdbook
      - run: mdbook build torviello-docs/docs

  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm audit --audit-level=high
