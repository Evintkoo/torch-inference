services:
  engine:
    image: ghcr.io/torviello/engine:1.0.0
    profiles: ["cpu"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TORCH_AUTH_ENABLED: "true"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  engine-gpu:
    image: ghcr.io/torviello/engine:1.0.0-gpu
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      TORCH_AUTH_ENABLED: "true"
      TORCH_ACCELERATOR: "cuda"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
