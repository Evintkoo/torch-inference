[target.x86_64-unknown-linux-gnu]
linker = "clang"

[target.aarch64-unknown-linux-gnu]
linker = "clang"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

# zip 9.5 (via tch 0.27) pulls zstd-sys, whose C objects must match rustc's
# aarch64-apple-darwin deployment target (11.0) or the final link rejects
# them: "object file ... was built for newer 'macOS' version (26.5) than
# being linked (11.0)". Pin the C deployment target to rustc's default so
# every cc-built dependency agrees with the link line.
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
