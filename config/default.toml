# Copyright (c) 2026 Torviello.
schema = "services/engine/api/contracts/schema.json"
model_registry = "config/model-registry.toml"
model_root = "models"
max_model_bytes = 1073741824
# 0 disables the capacity limit explicitly; positive values reject loads beyond it.
max_loaded_models = 2
download_concurrency = 2
download_timeout_ms = 300000
model_source_allowlist = [
  "huggingface.co",
  "cdn-lfs.huggingface.co",
  "models.torviello.local",
]
host = "127.0.0.1"
port = 8000
require_auth = true
auth_enabled = true
max_body_bytes = 1048576
max_frame_bytes = 262144
max_batch_size = 8
max_queue_depth = 32
timeout_ms = 30000
shutdown_timeout_ms = 15000
retention_max_age_days = 7
max_size_bytes = 104857600
rate_limit_per_minute = 120
decompression_max_expansion_bytes = 4194304
tls_min_version = "1.3"
cors_allowed_origin = "https://console.torviello.local"
accelerator_fallback = "cpu"

# Only enable an accelerator when the binary is built with the matching Cargo
# feature (`cuda`, `metal`, `vulkan`, `rocm`, `coreml`, or `directml`).
# Enabling a backend absent from the build fails startup with
# `model.backend_unavailable`.
[accelerators]
cuda = false
metal = false
vulkan = false
rocm = false
coreml = false
directml = false

[secrets]
source = "environment"
variables = ["TORCH_AUTH_JWT_SECRET", "TORCH_TLS_CERT", "TORCH_TLS_KEY"]
